        const dialogueNext = document.getElementById('dialogue-next');
        const mobileControls = document.getElementById('mobile-controls');
        const transitionOverlay = document.getElementById('transition-overlay');
        const transitionText = document.getElementById('transition-text');
        const hud = document.getElementById('hud');
        const academyRoom = document.getElementById('academy');
        const libraryRoom = document.getElementById('library');
        const grutrissheitBook = document.getElementById('grutrissheit-book');
        const sylvester = document.getElementById('sylvester');
        const sylvesterShadow = document.getElementById('sylvester-shadow');
        const choiceBox = document.getElementById('choice-box');
        const choicePrompt = document.getElementById('choice-prompt');
        const choiceButtons = document.getElementById('choice-buttons');
        const sovereigntyRoom = document.getElementById('sovereignty');
        const templeRoom = document.getElementById('temple');
        const questHud = document.getElementById('quest-hud');
        const questHudText = document.getElementById('quest-hud-text');

        // Attendants & Retainers
        const retainerIds = ['fran', 'gil', 'delia', 'philine', 'roderick', 'angelica', 'hartmut'];
        const retainers = {};
        retainerIds.forEach(id => {
            retainers[id] = {
                el: document.getElementById(id),
                shadow: document.getElementById(id + '-shadow'),
            };
        });

        // ===== WORLD =====
        let currentRoom = 'academy';
        let worldWidth = 2400;
        const CHAR_W = 40, CHAR_H = 70, MIN_BOTTOM = 20;
        function getMaxBottom() { return window.innerHeight * 0.55 - CHAR_H; }

        // ===== MYNE =====
        let myneX = 600, myneY = 60;
        let velX = 0, velY = 0;
        const accel = 0.8, friction = 0.78, maxSpeed = 5;
        let lastFacing = 'right';
        let playerCanMove = false;

        // ===== GRUTRISSHEIT =====
        let grutrissheitGrabbed = false;
        let sylvesterEncounterDone = false;
        const GRUT_X = 1788; // x position of the book

        // ===== SYLVESTER =====
        let sylvesterX = 0, sylvesterY = 60;
        let sylvesterWalking = false, sylvesterTargetX = null;
        let sylvesterVisible = false;

        // ===== HANNELORE =====
        let hanneloreX = 800, hanneloreY = 60;
        let hanneloreWalking = false, hanneloreTargetX = null;
        let hanneloreVisible = true;

        // ===== QUEST HUD =====
        let questTextValue = 'Talk to Hannelore';
        function updateQuest(text) {
            questTextValue = text;
            questHudText.textContent = text;
        }

        // ===== HELPER FUNCTIONS =====
        function setDialogueTheme(theme) {
            dialogueBox.className = '';
            if (theme) dialogueBox.classList.add(theme);
        }
        function setHudTheme(hudClass, questClass) {
            hud.className = '';
            questHud.className = '';
            if (hudClass) hud.classList.add(hudClass);
            if (questClass) questHud.classList.add(questClass);
        }
        function hideAllRooms() {
            academyRoom.style.display = 'none';
            libraryRoom.style.display = 'none';
            sovereigntyRoom.style.display = 'none';
            templeRoom.style.display = 'none';
        }
        function hideAllNPCs() {
            hannelore.style.display = 'none';
            hanneloreShadow.style.display = 'none';
            hanneloreVisible = false;
            sylvester.style.display = 'none';
            sylvesterShadow.style.display = 'none';
            sylvesterVisible = false;
            retainerIds.forEach(id => {
                retainers[id].el.style.display = 'none';
                retainers[id].shadow.style.display = 'none';
            });
        }

        function showRetainersInTemple() {
            // Position retainers in a semicircle around the altar area
            const positions = [
                { id: 'fran', x: 700, y: 60, facing: 'right' },      // left of altar, facing Myne
                { id: 'gil', x: 780, y: 80, facing: 'right' },        // behind Fran
                { id: 'delia', x: 850, y: 50, facing: 'right' },      // near altar
                { id: 'philine', x: 1050, y: 80, facing: 'left' },    // right side, shy in back
                { id: 'roderick', x: 1120, y: 60, facing: 'left' },   // right of altar
                { id: 'angelica', x: 1200, y: 55, facing: 'left' },   // far right, guarding
                { id: 'hartmut', x: 950, y: 45, facing: 'right' },    // right next to altar, dramatic
            ];
            positions.forEach(p => {
                const r = retainers[p.id];
                r.el.style.display = 'block';
                r.shadow.style.display = 'block';
                r.el.style.transform = p.facing === 'left' ? 'scaleX(-1)' : '';
                positionCharacter(r.el, r.shadow, p.x, p.y);
            });
        }

        // ===== CAMERA =====
        let camX = 0;
        function updateCamera() {
            const screenW = window.innerWidth;
            let targetCamX = myneX - screenW / 2 + CHAR_W / 2;
            targetCamX = Math.max(0, Math.min(worldWidth - screenW, targetCamX));
            camX += (targetCamX - camX) * 0.1;
            camera.style.transform = 'translateX(' + (-camX) + 'px)';
        }

        function positionCharacter(el, shadowEl, x, y) {
            el.style.left = x + 'px';
            el.style.bottom = y + 'px';
            if (shadowEl) {
                shadowEl.style.left = (x + 3) + 'px';
                shadowEl.style.bottom = (y - 6) + 'px';
                const s = 1 + (y - MIN_BOTTOM) * 0.002;
                shadowEl.style.transform = 'scaleX(' + s + ')';
                shadowEl.style.opacity = Math.max(0.2, 1 - (y - MIN_BOTTOM) * 0.003);
            }
        }

        // ===== INPUT =====
        const keys = {};
        document.addEventListener('keydown', (e) => { keys[e.key] = true; });
        document.addEventListener('keyup', (e) => { keys[e.key] = false; });
        let mobileUp = false, mobileDown = false, mobileLeft = false, mobileRight = false;
        function bindMobile(id, setFn) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); setFn(true); });
            btn.addEventListener('touchend', () => setFn(false));
            btn.addEventListener('touchcancel', () => setFn(false));
        }
        bindMobile('btn-up', v => mobileUp = v);
        bindMobile('btn-down', v => mobileDown = v);
        bindMobile('btn-left', v => mobileLeft = v);
        bindMobile('btn-right', v => mobileRight = v);

        // ===== DIALOGUE =====
        let dialogueQueue = [];
        let dialogueActive = false;
        let typewriterTimer = null;
        let currentFullText = '';
        let currentCharIndex = 0;
        let typewriterDone = false;
        let onDialogueEnd = null;

        function showDialogue(lines, onEnd) {
            dialogueQueue = lines.slice();
            dialogueActive = true;
            playerCanMove = false;
            dialogueBox.style.display = 'block';
            dialogueNext.style.display = 'none';
            mobileControls.classList.add('dialogue-active');
            onDialogueEnd = onEnd || null;
            advanceDialogue();
        }

        function advanceDialogue() {
            if (!typewriterDone) {
                clearInterval(typewriterTimer);
                dialogueText.textContent = currentFullText;
                typewriterDone = true;
                dialogueNext.style.display = 'block';
                return;
            }
            if (dialogueQueue.length === 0) {
                closeDialogue();
                return;
            }
            const line = dialogueQueue.shift();
            dialogueName.textContent = line.name;
            currentFullText = line.text;
            currentCharIndex = 0;
            typewriterDone = false;
            dialogueText.textContent = '';
            dialogueNext.style.display = 'none';
            typewriterTimer = setInterval(() => {
                if (currentCharIndex < currentFullText.length) {
                    dialogueText.textContent = currentFullText.slice(0, currentCharIndex + 1);
                    currentCharIndex++;
                } else {
                    clearInterval(typewriterTimer);
                    typewriterDone = true;
                    dialogueNext.style.display = 'block';
                }
            }, 35);
        }

        function closeDialogue() {
            dialogueActive = false;
            dialogueBox.style.display = 'none';
            mobileControls.classList.remove('dialogue-active');
            if (onDialogueEnd) {
                const cb = onDialogueEnd;
                onDialogueEnd = null;
                cb();
            } else {
                playerCanMove = true;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (dialogueActive && (e.key === ' ' || e.key === 'Enter')) {
                e.preventDefault();
                advanceDialogue();
            }
        });
        dialogueBox.addEventListener('click', () => { if (dialogueActive) advanceDialogue(); });

        // ===== SCENE TRANSITION =====
        function transitionToLibrary() {
            transitionText.textContent = 'Heading to the Library...';
            transitionOverlay.classList.add('active');

            setTimeout(() => {
                // Switch rooms
                hideAllRooms();
                libraryRoom.style.display = 'block';
                currentRoom = 'library';
                worldWidth = 2800;

                // Hide Hannelore
                hannelore.style.display = 'none';
                hanneloreShadow.style.display = 'none';
                hanneloreVisible = false;

                // Place Myne in library
                myneX = 200;
                myneY = 60;
                lastFacing = 'right';
                camX = 0;
                positionCharacter(myne, myneShadow, myneX, myneY);
                updateCamera();

                // Update HUD style
                hud.textContent = 'Royal Academy Library';
                setHudTheme('library-hud', 'library-quest-hud');
                setDialogueTheme('library-theme');
                updateQuest('Explore the library');

                // Fade out transition
                setTimeout(() => {
                    transitionOverlay.classList.remove('active');

                    // Library arrival dialogue
                    setTimeout(() => {
                        showDialogue([
                            { name: 'Myne', text: 'Look at all these books! The shelves go all the way to the ceiling!' },
                            { name: 'Myne', text: 'I could spend the rest of my life in here and never read them all...' },
                            { name: 'Myne', text: 'I wonder which section has the rare volumes from Dunkelfelger?' },
                        ]);
                    }, 500);
                }, 800);
            }, 1200);
        }

        // ===== TRANSITION TO SOVEREIGNTY =====
        function transitionToSovereignty() {
            transitionText.textContent = 'Taken to the Sovereignty for questioning...';
            transitionOverlay.classList.add('active');
            setTimeout(() => {
                hideAllRooms();
                hideAllNPCs();
                sovereigntyRoom.style.display = 'block';
                currentRoom = 'sovereignty';
                worldWidth = 600;
                myneX = 250; myneY = 60;
                lastFacing = 'right'; camX = 0;
                positionCharacter(myne, myneShadow, myneX, myneY);
                updateCamera();
                hud.textContent = 'Sovereignty — Interrogation Room';
                setHudTheme('sovereignty-hud', 'sovereignty-quest-hud');
                setDialogueTheme('sovereignty-theme');
                setTimeout(() => {
                    transitionOverlay.classList.remove('active');
                    setTimeout(() => { runSovereigntyScene(); }, 500);
                }, 800);
            }, 1200);
        }

        // ===== TRANSITION TO TEMPLE =====
        function transitionToTemple() {
            transitionText.textContent = 'Sneaking to the Ehrenfest Temple...';
            transitionOverlay.classList.add('active');
            setTimeout(() => {
                hideAllRooms();
                hideAllNPCs();
                templeRoom.style.display = 'block';
                currentRoom = 'temple';
                worldWidth = 1800;
                myneX = 200; myneY = 60;
                lastFacing = 'right'; camX = 0;
                positionCharacter(myne, myneShadow, myneX, myneY);
                updateCamera();
                hud.textContent = 'Ehrenfest Temple';
                setHudTheme('temple-hud', 'temple-quest-hud');
                setDialogueTheme('temple-theme');
                showRetainersInTemple();
                setTimeout(() => {
                    transitionOverlay.classList.remove('active');
                    setTimeout(() => { runTempleScene(); }, 500);
                }, 800);
            }, 1200);
        }

        // ===== SOVEREIGNTY SCENE =====
        function runSovereigntyScene() {
            showDialogue([
                { name: 'Myne', text: 'This room is so small... and there are no windows. It feels like a prison cell.' },
                { name: 'Sovereignty Official', text: 'Halt. You are the archnoble Rozemyne of Ehrenfest, correct?' },
                { name: 'Myne', text: 'Y-yes, that is me.' },
                { name: 'Sovereignty Official', text: "We received Aub Ehrenfest's message. He claims you found... the Grutrissheit." },
                { name: 'Head Librarian', text: 'How did an archduke candidate from Ehrenfest come to possess the Grutrissheit?' },
                { name: 'Myne', text: 'I just found it on the floor! In the Royal Academy library! I did not even know what it was at first!' },
                { name: 'Sovereignty Official', text: 'You expect us to believe that? The most sacred artifact in all of Yurgenschmidt was just... lying on the floor?' },
                { name: 'Head Librarian', text: 'Were you trying to claim the throne? This is treason.' },
                { name: 'Myne', text: 'Treason?! I picked up a book! I thought someone dropped it!' },
                { name: 'Myne', text: 'I love books more than anything, but I would never commit treason over one!' },
                { name: 'Myne', text: '...Probably.' },
                { name: 'Sovereignty Official', text: '...' },
                { name: 'Head Librarian', text: 'She did turn it in voluntarily. If she truly wanted to claim the throne, she would not have reported it.' },
                { name: 'Sovereignty Official', text: 'That is... a fair point. Very well.' },
                { name: 'Sovereignty Official', text: 'The Grutrissheit will be returned to its rightful place. Hand it over.' },
                { name: 'Myne', text: '...' },
                { name: 'Myne', text: 'Can I... can I at least look at one more page before\u2014' },
                { name: 'Sovereignty Official', text: 'No.' },
                { name: 'Myne', text: '...Fine.' },
                { name: 'Head Librarian', text: 'We acknowledge your cooperation, Lady Rozemyne. As an archduke candidate, your willingness to report this speaks well of Ehrenfest.' },
                { name: 'Sovereignty Official', text: 'Indeed. Possessing the Grutrissheit makes you a Zent candidate by right... but given the circumstances, we will overlook that claim.' },
                { name: 'Sovereignty Official', text: 'You are to speak of this to no one. Not a single soul. Is that understood?' },
                { name: 'Myne', text: 'I understand.' },
                { name: 'Myne', text: '(Goodbye, beautiful book... I barely got to know you...)' },
            ], () => {
                updateQuest('The book has been taken...');
                playerCanMove = true;
            });
        }

        // ===== TEMPLE SCENE =====
        function runTempleScene() {
            showDialogue([
                { name: 'Myne', text: 'Good, everyone is here. I need to tell you all something important.' },
                { name: 'Fran', text: 'Lady Rozemyne, what is the matter? You look unusually serious.' },
                { name: 'Myne', text: 'I found... the Grutrissheit. The holy book of the gods. And I am keeping it.' },
                { name: 'Fran', text: 'Lady Rozemyne, I must strongly advise against this. As an archduke candidate, you already draw enough attention. If the Sovereignty discovers you have hidden it, the consequences would be catastrophic!' },
                { name: 'Myne', text: 'I know, Fran. But think of what we could learn from it! Besides... having the Grutrissheit makes me a Zent candidate. That has to count for something.' },
                { name: 'Fran', text: 'A Zent candidate?! Lady Rozemyne, that makes this even MORE dangerous, not less!' },
                { name: 'Gil', text: 'L-Lady Rozemyne... are we going to get in trouble? I do not want to go back to the orphanage...' },
                { name: 'Myne', text: 'Nobody is going back to the orphanage, Gil. I promise.' },
                { name: 'Delia', text: 'With all due respect, Lady Rozemyne, we cannot hide something this important forever. Someone will find out eventually.' },
                { name: 'Delia', text: 'What happens when an auditor visits? Or when the Sovereignty sends inspectors?' },
                { name: 'Myne', text: 'We will cross that bridge when we come to it!' },
                { name: 'Philine', text: "Um... Lady Rozemyne... this seems very dangerous... I am worried about everyone's safety..." },
                { name: 'Myne', text: 'I appreciate your concern, Philine. But I have made up my mind.' },
                { name: 'Roderick', text: 'Lady Rozemyne, please consider your duty to Ehrenfest. As an archduke candidate — and now a Zent candidate — you have an enormous responsibility.' },
                { name: 'Roderick', text: 'Hiding the Grutrissheit puts everyone at risk. Lord Sylvester, Lady Florencia, all of us.' },
                { name: 'Myne', text: 'I know my duty, Roderick. And part of that duty is seeking knowledge!' },
                { name: 'Angelica', text: 'Lady Rozemyne! If anyone tries to take the book from you, I will fight them!' },
                { name: 'Angelica', text: 'I do not care if it is the Sovereignty or the king himself! My sword is yours!' },
                { name: 'Fran', text: '...That is not really the issue here, Angelica.' },
                { name: 'Roderick', text: 'Please do not fight the king, Angelica.' },
                { name: 'Hartmut', text: 'Everyone, EVERYONE! You are all missing the point!' },
                { name: 'Hartmut', text: 'Lady Rozemyne finding the Grutrissheit is clearly divine will! The gods themselves have chosen her as the true Zent!' },
                { name: 'Hartmut', text: 'She is the Saint of Ehrenfest! An archduke candidate AND a Zent candidate! The living embodiment of the goddess! Of COURSE the holy book came to her!' },
                { name: 'Hartmut', text: 'We should be celebrating! This is the greatest day in the history of Ehrenfest!' },
                { name: 'Fran', text: '...Please stop, Hartmut.' },
                { name: 'Gil', text: 'He is making it worse...' },
                { name: 'Delia', text: 'I think I have a headache.' },
                { name: 'Roderick', text: 'Hartmut, you are not helping.' },
                { name: 'Hartmut', text: 'I am ALWAYS helping! Everything I do is in service of Lady Rozemyne!' },
                { name: 'Myne', text: 'Thank you, Hartmut. I think.' },
                { name: 'Myne', text: 'Listen, everyone. I know this is risky. I know it is dangerous.' },
                { name: 'Myne', text: 'But this book contains knowledge that has been lost for generations. Formulas, prayers, secrets of the gods!' },
                { name: 'Myne', text: 'I cannot just hand it over to the Sovereignty where it will sit in a vault collecting dust!' },
                { name: 'Fran', text: '*sigh* ...I can see there is no changing your mind, Lady Rozemyne.' },
                { name: 'Myne', text: 'There is not. Now... the first order of business is figuring out how to read divine script.' },
                { name: 'Myne', text: 'I WILL learn to read the Book of Mestionora. No matter how long it takes!' },
                { name: 'Hartmut', text: 'GLORIOUS!' },
                { name: 'Fran', text: 'Please stop shouting, Hartmut.' },
            ], () => {
                updateQuest('Find a way to read the Book of Mestionora');
                playerCanMove = true;
            });
        }

        // ===== INTRO =====
        function runIntro() {
            hanneloreX = myneX + 400;
            hanneloreY = myneY;
            hanneloreTargetX = myneX + 70;
            hannelore.style.transform = 'scaleX(1)';
            hanneloreWalking = true;
            positionCharacter(hannelore, hanneloreShadow, hanneloreX, hanneloreY);
        }

        function onHanneloreArrived() {
            hanneloreWalking = false;
            hannelore.classList.remove('walking');
            hannelore.style.transform = 'scaleX(1)';

            showDialogue([
                { name: 'Hannelore', text: 'Rozemyne! There you are. I have been looking everywhere for you.' },
                { name: 'Hannelore', text: 'I have important news. The library committee is meeting today!' },
                { name: 'Hannelore', text: 'They are discussing which new books to add to the Royal Academy library this year.' },
                { name: 'Hannelore', text: 'I know how much you love books, so I thought you would want to attend.' },
                { name: 'Myne', text: 'The library committee?! Of course I want to go! Are there really new books?!' },
                { name: 'Hannelore', text: 'Yes! I heard there might be rare volumes from Dunkelfelger and Klassenberg.' },
                { name: 'Hannelore', text: 'The meeting room is further down the hall. We should hurry before it starts!' },
                { name: 'Myne', text: 'Books from other duchies... this is the best day ever! Let us go, Hannelore!' },
            ], () => {
                updateQuest('Explore the library');
                transitionToLibrary();
            });
        }

        // ===== GRUTRISSHEIT GRAB =====
        function triggerGrutrissheitGrab() {
            grutrissheitGrabbed = true;
            playerCanMove = false;
            velX = 0; velY = 0;

            // Remove book from floor
            grutrissheitBook.style.display = 'none';

            // Add book to Myne's hand
            const heldBook = document.createElement('div');
            heldBook.className = 'grutrissheit-held';
            myne.appendChild(heldBook);

            updateQuest('What is this book?');

            // Casual dialogue — she thinks it's just a book on the floor
            setTimeout(() => {
                showDialogue([
                    { name: 'Myne', text: 'Oh, someone left a book out. I should pick it up before it gets damaged.' },
                    { name: 'Myne', text: 'The cover is pretty. Must be one of the older volumes.' },
                    { name: 'Myne', text: 'I will just carry it with me and put it back on the right shelf later.' },
                ], () => {
                    // After picking up the book, Sylvester appears quickly
                    playerCanMove = true;
                    setTimeout(triggerSylvesterEncounter, 1000);
                });
            }, 300);
        }

        // ===== CHOICE SYSTEM =====
        function showChoice(prompt, choices) {
            playerCanMove = false;
            choicePrompt.textContent = prompt;
            while (choiceButtons.firstChild) choiceButtons.removeChild(choiceButtons.firstChild);
            choices.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = c.text;
                btn.addEventListener('click', () => {
                    choiceBox.style.display = 'none';
                    mobileControls.classList.remove('dialogue-active');
                    c.action();
                });
                choiceButtons.appendChild(btn);
            });
            choiceBox.style.display = 'block';
            mobileControls.classList.add('dialogue-active');
        }

        // ===== SYLVESTER ENCOUNTER =====
        function triggerSylvesterEncounter() {
            if (sylvesterEncounterDone) return;
            sylvesterEncounterDone = true;
            playerCanMove = false;
            velX = 0; velY = 0;

            updateQuest('Talk to Sylvester');

            // Sylvester appears from the right, walking toward Myne
            sylvester.style.display = 'block';
            sylvesterShadow.style.display = 'block';
            sylvesterVisible = true;
            sylvesterX = Math.min(myneX + 300, worldWidth - CHAR_W);
            sylvesterY = myneY;
            sylvesterTargetX = myneX + 70;
            sylvester.style.transform = 'scaleX(1)';
            sylvesterWalking = true;
            positionCharacter(sylvester, sylvesterShadow, sylvesterX, sylvesterY);
        }

        function onSylvesterArrived() {
            sylvesterWalking = false;
            sylvester.classList.remove('walking');
            sylvester.style.transform = 'scaleX(1)';

            showDialogue([
                { name: 'Sylvester', text: 'Rozemyne! There you are. I heard you ran off to the library again.' },
                { name: 'Sylvester', text: 'Honestly, can you not stay out of trouble for one single—' },
                { name: 'Sylvester', text: '...' },
                { name: 'Sylvester', text: 'Rozemyne. What is that book you are holding.' },
                { name: 'Myne', text: 'Hm? Oh, this? I just found it on the floor. Someone must have dropped it.' },
                { name: 'Sylvester', text: 'That... that golden binding... those divine symbols on the cover...' },
                { name: 'Sylvester', text: 'Rozemyne. That is the Grutrissheit.' },
                { name: 'Myne', text: 'The what now?' },
                { name: 'Sylvester', text: 'THE GRUTRISSHEIT! The holy book that contains the secrets of the gods!' },
                { name: 'Sylvester', text: 'The book that only the Zent — the ruler of all Yurgenschmidt — is meant to possess!' },
                { name: 'Myne', text: '...Oh.' },
                { name: 'Myne', text: 'OH.' },
                { name: 'Myne', text: 'I thought it was just a pretty book someone left out!!' },
                { name: 'Sylvester', text: 'How did you even — never mind. This is a disaster. If anyone finds out you have this...' },
                { name: 'Sylvester', text: 'As an archduke candidate of Ehrenfest, you already have a target on your back. But this... this makes you a Zent candidate.' },
                { name: 'Sylvester', text: 'Every archducal family in the country will want to use you. Or eliminate you.' },
            ], () => {
                updateQuest('What should Myne do?');
                // Present the choice
                showChoice('What should Myne do?', [
                    {
                        text: 'Report it — Tell Sylvester to bring it to the Sovereignty',
                        action: choiceReport,
                    },
                    {
                        text: 'Keep it secret — Hide the Grutrissheit and say nothing',
                        action: choiceKeepSecret,
                    },
                ]);
            });
        }

        function choiceReport() {
            updateQuest('Go to the Sovereignty');
            showDialogue([
                { name: 'Myne', text: 'You are right. This is too dangerous to keep hidden.' },
                { name: 'Myne', text: 'We should report this to the Sovereignty. If the Zent lost it, they need to know.' },
                { name: 'Sylvester', text: '...I am impressed, Rozemyne. That is the responsible choice.' },
                { name: 'Sylvester', text: 'I half expected you to say you wanted to read it first.' },
                { name: 'Myne', text: 'I mean... I DO want to read it. More than anything in the world.' },
                { name: 'Myne', text: 'But having every duchy in Yurgenschmidt trying to kidnap me sounds... bad.' },
                { name: 'Sylvester', text: 'Ha! At least you have some sense. Come, we will go together.' },
                { name: 'Sylvester', text: 'I will send a message to the Sovereignty immediately. Stay close to me.' },
                { name: 'Myne', text: '(I wonder if they would let me read just one page before handing it over...)' },
            ], transitionToSovereignty);
        }

        function choiceKeepSecret() {
            updateQuest('Hide the book');
            showDialogue([
                { name: 'Myne', text: '...What if we just... did not tell anyone?' },
                { name: 'Sylvester', text: 'WHAT?!' },
                { name: 'Myne', text: 'Think about it! If we report it, the Sovereignty will take it away immediately.' },
                { name: 'Myne', text: 'But if we keep it secret, I could study it. Learn the secrets of the gods!' },
                { name: 'Myne', text: 'There must be knowledge in here that has been lost for generations!' },
                { name: 'Sylvester', text: 'Rozemyne, this is insane. If anyone discovers we hid this—' },
                { name: 'Myne', text: 'Then we just have to make sure nobody discovers it!' },
                { name: 'Sylvester', text: '...' },
                { name: 'Sylvester', text: 'I cannot believe I am even considering this.' },
                { name: 'Sylvester', text: 'Fine. But if this goes wrong, I am blaming you entirely.' },
                { name: 'Myne', text: 'Deal! Now, let me see... the first page says...' },
                { name: 'Myne', text: '...I cannot read any of it. It is all in divine script.' },
                { name: 'Sylvester', text: 'Of course it is. You just committed treason for a book you cannot read.' },
                { name: 'Myne', text: 'I will LEARN to read it! Just give me time!' },
            ], transitionToTemple);
        }

        // ===== GAME LOOP =====
        function gameLoop() {
            if (hanneloreWalking && hanneloreTargetX !== null) {
                const dx = hanneloreTargetX - hanneloreX;
                if (Math.abs(dx) > 3) {
                    hanneloreX += Math.sign(dx) * 2.5;
                    hannelore.classList.add('walking');
                } else {
                    hanneloreX = hanneloreTargetX;
                    hanneloreTargetX = null;
                    onHanneloreArrived();
                }
                positionCharacter(hannelore, hanneloreShadow, hanneloreX, hanneloreY);
            }

            if (sylvesterWalking && sylvesterTargetX !== null) {
                const dx = sylvesterTargetX - sylvesterX;
                if (Math.abs(dx) > 3) {
                    sylvesterX += Math.sign(dx) * 4;
                    sylvester.classList.add('walking');
                } else {
                    sylvesterX = sylvesterTargetX;
                    sylvesterTargetX = null;
                    onSylvesterArrived();
                }
                positionCharacter(sylvester, sylvesterShadow, sylvesterX, sylvesterY);
            }

            if (playerCanMove) {
                let inputX = 0, inputY = 0;
                if (keys['ArrowLeft'] || keys['a'] || mobileLeft) inputX -= 1;
                if (keys['ArrowRight'] || keys['d'] || mobileRight) inputX += 1;
                if (keys['ArrowUp'] || keys['w'] || mobileUp) inputY += 1;
                if (keys['ArrowDown'] || keys['s'] || mobileDown) inputY -= 1;
                if (inputX !== 0 && inputY !== 0) { inputX *= 0.707; inputY *= 0.707; }

                velX += inputX * accel;
                velY += inputY * accel;
                const spd = Math.sqrt(velX * velX + velY * velY);
                if (spd > maxSpeed) { velX = (velX / spd) * maxSpeed; velY = (velY / spd) * maxSpeed; }
                velX *= friction; velY *= friction;
                if (Math.abs(velX) < 0.1) velX = 0;
                if (Math.abs(velY) < 0.1) velY = 0;

                myneX += velX; myneY += velY;
                myneX = Math.max(0, Math.min(worldWidth - CHAR_W, myneX));
                myneY = Math.max(MIN_BOTTOM, Math.min(getMaxBottom(), myneY));

                if (inputX < 0) lastFacing = 'left';
                else if (inputX > 0) lastFacing = 'right';

                const moving = Math.abs(velX) > 0.3 || Math.abs(velY) > 0.3;
                myne.className = 'character' + (moving ? ' walking' : '') + (lastFacing === 'left' ? ' face-left' : '');
            } else {
                velX = 0; velY = 0;
                myne.className = 'character' + (lastFacing === 'left' ? ' face-left' : '');
            }

            // Check if Myne is near the Grutrissheit
            if (currentRoom === 'library' && !grutrissheitGrabbed && Math.abs(myneX - GRUT_X) < 50) {
                triggerGrutrissheitGrab();
            }

            positionCharacter(myne, myneShadow, myneX, myneY);
            updateCamera();
            requestAnimationFrame(gameLoop);
        }

        // ===== START =====
        playBtn.addEventListener('click', () => {
            titleScreen.classList.add('hidden');
            gemBg.classList.add('hidden');
            gameScreen.style.display = 'block';
            myneX = 600; myneY = 60;
            camX = myneX - window.innerWidth / 2;
            positionCharacter(myne, myneShadow, myneX, myneY);
            updateCamera();
            updateQuest('Talk to Hannelore');
            requestAnimationFrame(gameLoop);
            setTimeout(runIntro, 800);
        });
    </script>
