<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An Ascendance Of A Bookworm Adventure</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(160deg, #0f0c29 0%, #1a1a3e 50%, #0f0c29 100%);
            overflow: hidden;
            font-family: 'Architects Daughter', cursive;
        }

        /* ===== TITLE SCREEN ===== */
        #title-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }
        #title-screen h1 {
            color: #b0d4ff;
            font-size: 2.5rem;
            text-align: center;
            text-shadow: 0 0 20px rgba(100, 170, 255, 0.6), 0 0 40px rgba(60, 140, 255, 0.3);
            margin-bottom: 40px;
        }
        #play-btn {
            font-family: 'Architects Daughter', cursive;
            font-size: 1.8rem;
            color: #fff;
            background: linear-gradient(135deg, rgba(60, 140, 255, 0.5), rgba(100, 180, 255, 0.3));
            border: 2px solid rgba(150, 200, 255, 0.5);
            border-radius: 12px;
            padding: 16px 48px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 10px rgba(100, 170, 255, 0.8);
            box-shadow: 0 0 20px rgba(60, 140, 255, 0.3);
        }
        #play-btn:hover {
            background: linear-gradient(135deg, rgba(80, 160, 255, 0.7), rgba(120, 200, 255, 0.5));
            box-shadow: 0 0 30px rgba(60, 140, 255, 0.6);
            transform: scale(1.05);
        }

        /* ===== GEM BACKGROUND ===== */
        .gem-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        .gem {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .gem-top {
            width: 0; height: 0;
            border-left: 120px solid transparent; border-right: 120px solid transparent;
            border-bottom: 80px solid rgba(60, 140, 255, 0.4);
            position: absolute; top: -180px; left: 50%; transform: translateX(-50%);
        }
        .gem-crown-left {
            width: 0; height: 0;
            border-left: 60px solid transparent; border-right: 60px solid transparent;
            border-bottom: 80px solid rgba(100, 180, 255, 0.35);
            position: absolute; top: -180px; left: calc(50% - 60px); transform: translateX(-50%);
        }
        .gem-crown-right {
            width: 0; height: 0;
            border-left: 60px solid transparent; border-right: 60px solid transparent;
            border-bottom: 80px solid rgba(30, 100, 220, 0.35);
            position: absolute; top: -180px; left: calc(50% + 60px); transform: translateX(-50%);
        }
        .gem-body {
            width: 240px; height: 0;
            border-top: 220px solid rgba(50, 130, 255, 0.35);
            border-left: 120px solid transparent; border-right: 120px solid transparent;
            position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
        }
        .gem-facet-left {
            width: 0; height: 0;
            border-top: 220px solid rgba(100, 180, 255, 0.2);
            border-left: 120px solid transparent; border-right: 0 solid transparent;
            position: absolute; top: -100px; left: calc(50% - 120px);
        }
        .gem-facet-right {
            width: 0; height: 0;
            border-top: 220px solid rgba(20, 80, 200, 0.25);
            border-left: 0 solid transparent; border-right: 120px solid transparent;
            position: absolute; top: -100px; left: 50%;
        }
        .sparkle {
            position: absolute; width: 4px; height: 4px;
            background: white; border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }
        .sparkle:nth-child(1) { top: 25%; left: 40%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 35%; left: 55%; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { top: 45%; left: 45%; animation-delay: 1s; }
        .sparkle:nth-child(4) { top: 30%; left: 52%; animation-delay: 1.5s; }
        .sparkle:nth-child(5) { top: 55%; left: 48%; animation-delay: 0.3s; }
        .sparkle:nth-child(6) { top: 40%; left: 60%; animation-delay: 0.8s; }
        .sparkle:nth-child(7) { top: 50%; left: 42%; animation-delay: 1.2s; }
        .sparkle:nth-child(8) { top: 33%; left: 47%; animation-delay: 1.7s; }
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.5); }
        }
        .gem-glow {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -45%);
            width: 300px; height: 350px;
            background: radial-gradient(ellipse, rgba(60, 140, 255, 0.3) 0%, rgba(60, 140, 255, 0.1) 40%, transparent 70%);
            animation: glow-pulse 3s ease-in-out infinite;
        }
        @keyframes glow-pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* ===== GAME SCREEN ===== */
        #game-screen {
            display: none;
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2; overflow: hidden;
        }

        #camera {
            position: absolute;
            width: 100%; height: 100%;
        }

        /* ===== ACADEMY HALLWAY (cool blues) ===== */
        .room {
            position: absolute;
            height: 100%;
        }
        #academy { width: 2400px; background: linear-gradient(180deg, #1a1a3e 0%, #2a2a5e 40%, #3a3a4e 40%, #4a4a5e 100%); }
        #academy .floor {
            position: absolute; bottom: 0; width: 100%; height: 60%;
            background:
                repeating-linear-gradient(90deg, rgba(80, 80, 120, 0.3) 0px, rgba(80, 80, 120, 0.3) 1px, transparent 1px, transparent 80px),
                repeating-linear-gradient(0deg, rgba(80, 80, 120, 0.3) 0px, rgba(80, 80, 120, 0.3) 1px, transparent 1px, transparent 80px),
                linear-gradient(180deg, #3d3555 0%, #2d2545 100%);
        }
        #academy .wall {
            position: absolute; top: 0; width: 100%; height: 40%;
            background:
                repeating-linear-gradient(90deg, rgba(60, 50, 80, 0.5) 0px, rgba(60, 50, 80, 0.5) 2px, transparent 2px, transparent 60px),
                repeating-linear-gradient(0deg, rgba(60, 50, 80, 0.3) 0px, rgba(60, 50, 80, 0.3) 2px, transparent 2px, transparent 30px),
                linear-gradient(180deg, #1a1535 0%, #2a2050 100%);
        }

        /* ===== LIBRARY (warm golds/ambers) ===== */
        #library { width: 2800px; background: linear-gradient(180deg, #2a1a0a 0%, #3d2a15 40%, #4a3520 40%, #3a2a18 100%); display: none; }
        #library .floor {
            position: absolute; bottom: 0; width: 100%; height: 60%;
            background:
                repeating-linear-gradient(90deg, rgba(120, 90, 50, 0.25) 0px, rgba(120, 90, 50, 0.25) 1px, transparent 1px, transparent 80px),
                repeating-linear-gradient(0deg, rgba(120, 90, 50, 0.25) 0px, rgba(120, 90, 50, 0.25) 1px, transparent 1px, transparent 80px),
                linear-gradient(180deg, #4a3828 0%, #3a2818 100%);
        }
        #library .wall {
            position: absolute; top: 0; width: 100%; height: 40%;
            background:
                repeating-linear-gradient(90deg, rgba(90, 60, 30, 0.4) 0px, rgba(90, 60, 30, 0.4) 2px, transparent 2px, transparent 60px),
                repeating-linear-gradient(0deg, rgba(90, 60, 30, 0.3) 0px, rgba(90, 60, 30, 0.3) 2px, transparent 2px, transparent 30px),
                linear-gradient(180deg, #2a1a0a 0%, #3d2815 100%);
        }

        /* Library windows — warm golden light */
        .lib-window {
            position: absolute; top: 5%;
            width: 70px; height: 110px;
            background: linear-gradient(180deg, rgba(255, 200, 100, 0.25) 0%, rgba(255, 170, 60, 0.1) 100%);
            border: 3px solid #6a4830;
            border-radius: 35px 35px 0 0;
            box-shadow: 0 0 20px rgba(255, 180, 80, 0.15);
        }
        .lib-window::after {
            content: ''; position: absolute;
            top: 50%; left: 0; right: 0; height: 2px;
            background: #6a4830;
        }
        .lib-window::before {
            content: ''; position: absolute;
            top: 0; bottom: 0; left: 50%; width: 2px;
            background: #6a4830;
        }

        /* Tall library bookshelves */
        .lib-shelf {
            position: absolute; bottom: 40%;
            width: 120px; height: 200px;
            background: linear-gradient(180deg, #5a3d20 0%, #4a3018 50%, #3d2510 100%);
            border: 2px solid #6a4828;
            border-radius: 3px 3px 0 0;
        }
        .lib-shelf-row {
            position: absolute; left: 5px; right: 5px;
            height: 28px;
            border-radius: 2px;
        }
        .lib-shelf-row:nth-child(1) { bottom: 6px; background: repeating-linear-gradient(90deg, #a04040, #a04040 9px, #4060a0 9px, #4060a0 17px, #408040 17px, #408040 25px, #a08040 25px, #a08040 33px, #8040a0 33px, #8040a0 41px, #a06040 41px, #a06040 49px); }
        .lib-shelf-row:nth-child(2) { bottom: 40px; background: repeating-linear-gradient(90deg, #8040a0, #8040a0 11px, #a08040 11px, #a08040 20px, #408040 20px, #408040 28px, #4060a0 28px, #4060a0 38px, #a04040 38px, #a04040 46px); }
        .lib-shelf-row:nth-child(3) { bottom: 74px; background: repeating-linear-gradient(90deg, #4060a0, #4060a0 8px, #a04040 8px, #a04040 18px, #a08040 18px, #a08040 26px, #408040 26px, #408040 36px, #8040a0 36px, #8040a0 44px, #a06040 44px, #a06040 52px); }
        .lib-shelf-row:nth-child(4) { bottom: 108px; background: repeating-linear-gradient(90deg, #a06040, #a06040 10px, #408040 10px, #408040 19px, #a04040 19px, #a04040 28px, #4060a0 28px, #4060a0 36px, #8040a0 36px, #8040a0 46px); }
        .lib-shelf-row:nth-child(5) { bottom: 142px; background: repeating-linear-gradient(90deg, #408040, #408040 12px, #a06040 12px, #a06040 22px, #8040a0 22px, #8040a0 30px, #a08040 30px, #a08040 40px, #4060a0 40px, #4060a0 48px); }
        .lib-shelf-row:nth-child(6) { bottom: 170px; background: repeating-linear-gradient(90deg, #a08040, #a08040 9px, #4060a0 9px, #4060a0 20px, #a04040 20px, #a04040 28px, #408040 28px, #408040 38px, #a06040 38px, #a06040 46px); }

        /* Reading desk */
        .reading-desk {
            position: absolute; bottom: 60%;
            width: 80px; height: 35px;
            background: linear-gradient(180deg, #6a4828 0%, #5a3818 100%);
            border: 2px solid #7a5838;
            border-radius: 3px;
        }
        .reading-desk::before {
            content: ''; position: absolute;
            top: 4px; left: 10px;
            width: 25px; height: 18px;
            background: #e8d8b0;
            border: 1px solid #c8b890;
            transform: rotate(-5deg);
        }
        .reading-desk::after {
            content: ''; position: absolute;
            top: 6px; right: 10px;
            width: 20px; height: 14px;
            background: #d0c0a0;
            border: 1px solid #b8a880;
            transform: rotate(3deg);
        }

        /* Candelabra */
        .candelabra {
            position: absolute; bottom: 62%;
            width: 20px; height: 40px;
        }
        .candelabra::before {
            content: ''; position: absolute;
            bottom: 0; left: 6px;
            width: 8px; height: 30px;
            background: linear-gradient(180deg, #c8a860, #a08040);
            border-radius: 2px;
        }
        .candelabra::after {
            content: ''; position: absolute;
            top: -8px; left: 3px;
            width: 14px; height: 14px;
            background: radial-gradient(ellipse, #ffcc44 0%, #ff9922 40%, transparent 70%);
            border-radius: 50%;
            animation: candle-flicker 0.8s ease-in-out infinite alternate;
        }
        @keyframes candle-flicker {
            0% { transform: scaleY(1) scaleX(0.9); opacity: 0.85; }
            100% { transform: scaleY(1.1) scaleX(1); opacity: 1; }
        }
        /* Candelabra ambient glow */
        .candelabra-glow {
            position: absolute;
            width: 80px; height: 80px;
            background: radial-gradient(ellipse, rgba(255, 190, 80, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Shared window style */
        .window {
            position: absolute; top: 5%;
            width: 60px; height: 100px;
            background: linear-gradient(180deg, rgba(100, 160, 255, 0.3) 0%, rgba(60, 120, 200, 0.15) 100%);
            border: 3px solid #4a4070;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 0 15px rgba(100, 160, 255, 0.2);
        }
        .window::after {
            content: ''; position: absolute;
            top: 50%; left: 0; right: 0; height: 2px;
            background: #4a4070;
        }

        .bookshelf {
            position: absolute; bottom: 62%;
            width: 100px; height: 80px;
            background: #3d2b1f; border: 2px solid #5a3d2b; border-radius: 3px;
        }
        .bookshelf::before {
            content: ''; position: absolute;
            bottom: 5px; left: 5px; right: 5px; height: 30px;
            background: repeating-linear-gradient(90deg, #c44, #c44 8px, #48c 8px, #48c 16px, #4a4 16px, #4a4 24px, #c84 24px, #c84 32px, #84c 32px, #84c 40px);
            border-radius: 2px;
        }
        .bookshelf::after {
            content: ''; position: absolute;
            bottom: 40px; left: 5px; right: 5px; height: 30px;
            background: repeating-linear-gradient(90deg, #84c, #84c 10px, #c84 10px, #c84 18px, #4a4 18px, #4a4 26px, #48c 26px, #48c 34px, #c44 34px, #c44 42px);
            border-radius: 2px;
        }

        .torch {
            position: absolute; bottom: 62%;
            width: 10px; height: 30px;
            background: linear-gradient(180deg, #5a3d2b, #3d2b1f); border-radius: 2px;
        }
        .torch::before {
            content: ''; position: absolute;
            top: -12px; left: -4px; width: 18px; height: 16px;
            background: radial-gradient(ellipse, #ff9944 0%, #ff6600 40%, transparent 70%);
            border-radius: 50%;
            animation: torch-flicker 0.5s ease-in-out infinite alternate;
        }
        .torch::after {
            content: ''; position: absolute;
            top: -40px; left: -20px; width: 50px; height: 50px;
            background: radial-gradient(ellipse, rgba(255, 150, 50, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        @keyframes torch-flicker {
            0% { transform: scaleY(1) scaleX(1); opacity: 0.9; }
            100% { transform: scaleY(1.15) scaleX(0.9); opacity: 1; }
        }

        /* ===== CHARACTER BASE ===== */
        .character {
            position: absolute; width: 40px; height: 70px; z-index: 10;
        }
        .character .hair { position: absolute; top: 0; left: 2px; width: 36px; height: 24px; border-radius: 50% 50% 0 0; }
        .character .hair-side-l { position: absolute; top: 14px; left: 0; width: 8px; height: 30px; border-radius: 0 0 4px 4px; }
        .character .hair-side-r { position: absolute; top: 14px; right: 0; width: 8px; height: 30px; border-radius: 0 0 4px 4px; }
        .character .face { position: absolute; top: 10px; left: 8px; width: 24px; height: 20px; background: #fce4c8; border-radius: 50%; }
        .character .eye-l, .character .eye-r { position: absolute; top: 17px; width: 5px; height: 5px; border-radius: 50%; }
        .character .eye-l { left: 12px; }
        .character .eye-r { right: 12px; }
        .character .robe { position: absolute; top: 28px; left: 5px; width: 30px; height: 32px; border-radius: 4px 4px 8px 8px; }
        .character .robe-trim { position: absolute; top: 28px; left: 12px; width: 16px; height: 32px; background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent); border-radius: 2px; }
        .character .cape { position: absolute; top: 28px; left: 2px; width: 36px; height: 28px; border-radius: 4px 4px 12px 12px; z-index: -1; transform-origin: top center; }
        .character .arm-l { position: absolute; top: 30px; left: -2px; width: 7px; height: 22px; border-radius: 4px; transform-origin: top center; }
        .character .arm-r { position: absolute; top: 30px; right: -2px; width: 7px; height: 22px; border-radius: 4px; transform-origin: top center; }
        .character .arm-l::after, .character .arm-r::after { content: ''; position: absolute; bottom: 0; width: 7px; height: 6px; background: #fce4c8; border-radius: 50%; }
        .character .foot-l, .character .foot-r { position: absolute; bottom: 0; width: 12px; height: 8px; background: #2a2a2a; border-radius: 4px; transform-origin: top center; }
        .character .foot-l { left: 6px; }
        .character .foot-r { right: 6px; }

        /* Myne */
        #myne .hair, #myne .hair-side-l, #myne .hair-side-r { background: #1a3a6e; }
        #myne .eye-l, #myne .eye-r { background: #1a3a6e; }
        #myne .hairpin { position: absolute; top: 8px; right: 6px; width: 8px; height: 8px; background: #ffd700; border-radius: 50%; box-shadow: 0 0 4px rgba(255, 215, 0, 0.6); animation: hairpin-glow 2s ease-in-out infinite; }
        @keyframes hairpin-glow {
            0%, 100% { box-shadow: 0 0 4px rgba(255, 215, 0, 0.6); }
            50% { box-shadow: 0 0 10px rgba(255, 215, 0, 1), 0 0 20px rgba(255, 215, 0, 0.4); }
        }
        #myne .robe { background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%); }
        #myne .arm-l, #myne .arm-r { background: #2a2a2a; }
        #myne .cape { background: rgba(30, 30, 30, 0.6); }

        /* Hannelore */
        #hannelore .hair, #hannelore .hair-side-l, #hannelore .hair-side-r { background: #e88aab; }
        #hannelore .eye-l, #hannelore .eye-r { background: #5588bb; }
        #hannelore .robe { background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%); }
        #hannelore .arm-l, #hannelore .arm-r { background: #2a2a2a; }
        #hannelore .cape { background: rgba(30, 30, 30, 0.6); }
        #hannelore .hair-ribbon { position: absolute; top: 6px; left: 4px; width: 32px; height: 6px; background: #cc6688; border-radius: 3px; }
        #hannelore .hair-ribbon::before, #hannelore .hair-ribbon::after { content: ''; position: absolute; top: -2px; width: 10px; height: 10px; background: #cc6688; border-radius: 50% 50% 50% 0; }
        #hannelore .hair-ribbon::before { left: -4px; transform: rotate(-45deg); }
        #hannelore .hair-ribbon::after { right: -4px; transform: rotate(45deg); }
        #hannelore:not(.walking) .robe { animation: breathe 2.5s ease-in-out infinite; }
        #hannelore:not(.walking) .hair-side-l { animation: hair-bounce 3s ease-in-out infinite; }
        #hannelore:not(.walking) .hair-side-r { animation: hair-bounce 3s ease-in-out infinite 0.3s; }

        /* Sylvester */
        #sylvester .hair, #sylvester .hair-side-l, #sylvester .hair-side-r { background: #2a5aaa; }
        #sylvester .eye-l, #sylvester .eye-r { background: #2a5aaa; }
        #sylvester .robe { background: linear-gradient(180deg, #e8c840 0%, #d4b030 100%); }
        #sylvester .arm-l, #sylvester .arm-r { background: #e8c840; }
        #sylvester .cape { background: rgba(200, 170, 40, 0.5); }
        #sylvester .syl-mantle { position: absolute; top: 26px; left: -4px; width: 48px; height: 16px; background: linear-gradient(180deg, #d4a040, #b88830); border-radius: 6px 6px 0 0; z-index: -1; }
        #sylvester:not(.walking) .robe { animation: breathe 2.8s ease-in-out infinite; }
        #sylvester:not(.walking) .hair-side-l { animation: hair-bounce 3.2s ease-in-out infinite; }
        #sylvester:not(.walking) .hair-side-r { animation: hair-bounce 3.2s ease-in-out infinite 0.4s; }

        /* Fran (head attendant — silver/gray hair, blue-gray robes) */
        #fran .hair, #fran .hair-side-l, #fran .hair-side-r { background: #8898a8; }
        #fran .eye-l, #fran .eye-r { background: #4a5a6a; }
        #fran .robe { background: linear-gradient(180deg, #3a4a5a 0%, #2a3a4a 100%); }
        #fran .arm-l, #fran .arm-r { background: #3a4a5a; }
        #fran .cape { background: rgba(50, 60, 75, 0.6); }
        #fran:not(.walking) .robe { animation: breathe 2.6s ease-in-out infinite; }
        #fran:not(.walking) .hair-side-l { animation: hair-bounce 3s ease-in-out infinite 0.1s; }
        #fran:not(.walking) .hair-side-r { animation: hair-bounce 3s ease-in-out infinite 0.5s; }

        /* Gil (young attendant — orange-brown hair, simpler robes) */
        #gil .hair, #gil .hair-side-l, #gil .hair-side-r { background: #b87030; }
        #gil .eye-l, #gil .eye-r { background: #6a5030; }
        #gil .robe { background: linear-gradient(180deg, #4a4040 0%, #3a3030 100%); }
        #gil .arm-l, #gil .arm-r { background: #4a4040; }
        #gil .cape { background: rgba(60, 50, 45, 0.5); }
        #gil:not(.walking) .robe { animation: breathe 2.3s ease-in-out infinite; }
        #gil:not(.walking) .hair-side-l { animation: hair-bounce 2.8s ease-in-out infinite; }
        #gil:not(.walking) .hair-side-r { animation: hair-bounce 2.8s ease-in-out infinite 0.2s; }

        /* Delia (attendant — reddish-pink hair, neat robes) */
        #delia .hair, #delia .hair-side-l, #delia .hair-side-r { background: #c06080; }
        #delia .eye-l, #delia .eye-r { background: #8a5070; }
        #delia .robe { background: linear-gradient(180deg, #3a3040 0%, #2a2030 100%); }
        #delia .arm-l, #delia .arm-r { background: #3a3040; }
        #delia .cape { background: rgba(50, 40, 55, 0.5); }
        #delia .delia-bow { position: absolute; top: 4px; right: 4px; width: 10px; height: 8px; background: #d070a0; border-radius: 50%; }
        #delia:not(.walking) .robe { animation: breathe 2.5s ease-in-out infinite 0.2s; }
        #delia:not(.walking) .hair-side-l { animation: hair-bounce 3.1s ease-in-out infinite 0.15s; }
        #delia:not(.walking) .hair-side-r { animation: hair-bounce 3.1s ease-in-out infinite 0.45s; }

        /* Philine (retainer — light blonde, timid) */
        #philine .hair, #philine .hair-side-l, #philine .hair-side-r { background: #e0d090; }
        #philine .eye-l, #philine .eye-r { background: #6a8a50; }
        #philine .robe { background: linear-gradient(180deg, #4a5040 0%, #3a4030 100%); }
        #philine .arm-l, #philine .arm-r { background: #4a5040; }
        #philine .cape { background: rgba(60, 65, 50, 0.5); }
        #philine:not(.walking) .robe { animation: breathe 2.2s ease-in-out infinite 0.3s; }
        #philine:not(.walking) .hair-side-l { animation: hair-bounce 3.3s ease-in-out infinite 0.2s; }
        #philine:not(.walking) .hair-side-r { animation: hair-bounce 3.3s ease-in-out infinite 0.6s; }

        /* Roderick (knight retainer — brown hair, armored look) */
        #roderick .hair, #roderick .hair-side-l, #roderick .hair-side-r { background: #6a4a30; }
        #roderick .eye-l, #roderick .eye-r { background: #4a3a28; }
        #roderick .robe { background: linear-gradient(180deg, #5a5a68 0%, #4a4a58 100%); }
        #roderick .arm-l, #roderick .arm-r { background: #5a5a68; }
        #roderick .cape { background: rgba(70, 70, 85, 0.6); }
        #roderick .rod-pauldron { position: absolute; top: 26px; left: -3px; width: 46px; height: 10px; background: linear-gradient(180deg, #7a7a8a, #5a5a6a); border-radius: 4px 4px 0 0; z-index: -1; }
        #roderick:not(.walking) .robe { animation: breathe 3s ease-in-out infinite; }
        #roderick:not(.walking) .hair-side-l { animation: hair-bounce 3.5s ease-in-out infinite; }
        #roderick:not(.walking) .hair-side-r { animation: hair-bounce 3.5s ease-in-out infinite 0.3s; }

        /* Angelica (knight — silver/white hair, strong) */
        #angelica .hair, #angelica .hair-side-l, #angelica .hair-side-r { background: #c0c8d8; }
        #angelica .eye-l, #angelica .eye-r { background: #4060a0; }
        #angelica .robe { background: linear-gradient(180deg, #5a6070 0%, #4a5060 100%); }
        #angelica .arm-l, #angelica .arm-r { background: #5a6070; }
        #angelica .cape { background: rgba(70, 75, 90, 0.6); }
        #angelica .ang-pauldron { position: absolute; top: 26px; left: -4px; width: 48px; height: 12px; background: linear-gradient(180deg, #8a8a9a, #6a6a7a); border-radius: 5px 5px 0 0; z-index: -1; }
        #angelica:not(.walking) .robe { animation: breathe 2.7s ease-in-out infinite 0.1s; }
        #angelica:not(.walking) .hair-side-l { animation: hair-bounce 3s ease-in-out infinite 0.3s; }
        #angelica:not(.walking) .hair-side-r { animation: hair-bounce 3s ease-in-out infinite 0.7s; }

        /* Hartmut (zealous retainer — dark hair, ornate robes) */
        #hartmut .hair, #hartmut .hair-side-l, #hartmut .hair-side-r { background: #2a2040; }
        #hartmut .eye-l, #hartmut .eye-r { background: #4a3060; }
        #hartmut .robe { background: linear-gradient(180deg, #3a2050 0%, #2a1040 100%); }
        #hartmut .arm-l, #hartmut .arm-r { background: #3a2050; }
        #hartmut .cape { background: rgba(45, 25, 60, 0.6); }
        #hartmut .hart-stole { position: absolute; top: 27px; left: 8px; width: 24px; height: 30px; background: linear-gradient(180deg, rgba(200, 170, 80, 0.4), rgba(180, 150, 60, 0.2)); border-radius: 2px; z-index: 1; }
        #hartmut:not(.walking) .robe { animation: breathe 2.4s ease-in-out infinite; }
        #hartmut:not(.walking) .hair-side-l { animation: hair-bounce 2.9s ease-in-out infinite 0.1s; }
        #hartmut:not(.walking) .hair-side-r { animation: hair-bounce 2.9s ease-in-out infinite 0.4s; }

        .char-shadow { position: absolute; width: 34px; height: 8px; background: radial-gradient(ellipse, rgba(0,0,0,0.35) 0%, transparent 70%); z-index: 9; pointer-events: none; }

        /* Walking */
        .character.walking { animation: body-bob 0.35s ease-in-out infinite; }
        .character.walking .foot-l { animation: limb-swing 0.35s ease-in-out infinite; }
        .character.walking .foot-r { animation: limb-swing 0.35s ease-in-out infinite reverse; }
        .character.walking .arm-l { animation: arm-swing 0.35s ease-in-out infinite; }
        .character.walking .arm-r { animation: arm-swing 0.35s ease-in-out infinite reverse; }
        .character.walking .cape { animation: cape-flow 0.35s ease-in-out infinite alternate; }
        .character.walking .hair-side-l { animation: hair-bounce 0.35s ease-in-out infinite; }
        .character.walking .hair-side-r { animation: hair-bounce 0.35s ease-in-out infinite 0.1s; }
        @keyframes body-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
        .character.walking.face-left { animation: body-bob-flip 0.35s ease-in-out infinite; }
        @keyframes body-bob-flip { 0%, 100% { transform: scaleX(-1) translateY(0); } 50% { transform: scaleX(-1) translateY(-2px); } }
        @keyframes limb-swing { 0%, 100% { transform: translateY(0) translateX(-2px); } 50% { transform: translateY(-5px) translateX(2px); } }
        @keyframes arm-swing { 0%, 100% { transform: rotate(15deg); } 50% { transform: rotate(-15deg); } }
        @keyframes cape-flow { 0% { transform: skewX(-3deg); } 100% { transform: skewX(3deg); } }
        @keyframes hair-bounce { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(1px) rotate(2deg); } }
        #myne:not(.walking) .robe { animation: breathe 2.5s ease-in-out infinite; }
        @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.02); } }
        .character.face-left { transform: scaleX(-1); }

        /* ===== SCENE TRANSITION ===== */
        #transition-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }
        #transition-overlay.active { opacity: 1; pointer-events: all; }
        #transition-text {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #e8d0a0;
            font-size: 1.6rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease 0.4s;
            text-shadow: 0 0 15px rgba(255, 200, 100, 0.5);
        }
        #transition-overlay.active #transition-text { opacity: 1; }

        /* ===== DIALOGUE BOX ===== */
        #dialogue-box {
            display: none; position: fixed;
            bottom: 40px; left: 50%; transform: translateX(-50%);
            width: min(90%, 500px);
            background: rgba(15, 12, 40, 0.92);
            border: 2px solid rgba(150, 180, 255, 0.4);
            border-radius: 14px; padding: 18px 22px;
            z-index: 30;
            box-shadow: 0 0 30px rgba(60, 100, 200, 0.3);
        }
        /* Library-themed dialogue */
        #dialogue-box.library-theme {
            background: rgba(40, 25, 10, 0.94);
            border-color: rgba(200, 170, 100, 0.4);
            box-shadow: 0 0 30px rgba(200, 150, 50, 0.2);
        }
        #dialogue-name { color: #c0c8e0; font-size: 1rem; margin-bottom: 6px; text-shadow: 0 0 6px rgba(150, 180, 255, 0.5); }
        .library-theme #dialogue-name { color: #e8d0a0; text-shadow: 0 0 6px rgba(200, 170, 100, 0.5); }
        #dialogue-text { color: #e0e8ff; font-size: 1.1rem; line-height: 1.5; min-height: 3em; }
        .library-theme #dialogue-text { color: #f0e8d8; }
        #dialogue-next { color: rgba(180, 200, 255, 0.6); font-size: 0.85rem; text-align: right; margin-top: 8px; animation: blink-prompt 1.2s ease-in-out infinite; }
        .library-theme #dialogue-next { color: rgba(220, 190, 120, 0.6); }
        @keyframes blink-prompt { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        /* HUD */
        #hud { position: fixed; top: 10px; left: 10px; color: #b0d4ff; font-size: 1.1rem; z-index: 20; text-shadow: 0 0 8px rgba(60, 140, 255, 0.5); }
        #hud.library-hud { color: #e8d0a0; text-shadow: 0 0 8px rgba(200, 160, 80, 0.5); }
        #hud.sovereignty-hud { color: #c0d0e8; text-shadow: 0 0 8px rgba(120, 150, 200, 0.5); }
        #hud.temple-hud { color: #e8d0a0; text-shadow: 0 0 8px rgba(200, 160, 80, 0.5); }

        /* Mobile */
        #mobile-controls { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 20; flex-direction: column; align-items: center; gap: 6px; }
        .mobile-row { display: flex; gap: 6px; }
        #mobile-controls button { font-size: 1.8rem; width: 56px; height: 56px; border: 2px solid rgba(150, 200, 255, 0.4); background: rgba(30, 60, 120, 0.6); color: #fff; border-radius: 12px; cursor: pointer; user-select: none; -webkit-user-select: none; transition: background 0.1s; }
        #mobile-controls button:active { background: rgba(60, 120, 220, 0.8); }
        #mobile-controls.dialogue-active { bottom: 160px; }
        @media (pointer: coarse) { #mobile-controls { display: flex; } }

        .hidden { display: none !important; }

        /* ===== GRUTRISSHEIT (looks like a normal book on the floor) ===== */
        .grutrissheit-book {
            position: absolute; bottom: 22%;
            width: 36px; height: 26px;
            background: linear-gradient(135deg, #d8c8a0 0%, #c8b888 40%, #b8a878 100%);
            border: 1px solid #a89868;
            border-radius: 2px 4px 4px 2px;
            z-index: 6;
            transform: rotate(-8deg);
        }
        .grutrissheit-book::before {
            content: ''; position: absolute;
            left: 0; top: 2px; bottom: 2px; width: 4px;
            background: linear-gradient(90deg, #a89060, #c8b888);
            border-radius: 2px 0 0 2px;
        }

        /* Myne holding book */
        .grutrissheit-held {
            position: absolute;
            top: 22px; right: -16px;
            width: 20px; height: 16px;
            background: linear-gradient(135deg, #f0e8c0, #d8c888);
            border: 1px solid #c8a860;
            border-radius: 1px 3px 3px 1px;
            box-shadow: 0 0 10px rgba(255, 215, 100, 0.6);
            z-index: 11;
            animation: held-glow 2s ease-in-out infinite;
        }
        @keyframes held-glow {
            0%, 100% { box-shadow: 0 0 8px rgba(255, 215, 100, 0.4); }
            50% { box-shadow: 0 0 16px rgba(255, 215, 100, 0.9), 0 0 30px rgba(255, 200, 60, 0.4); }
        }

        /* ===== CHOICE BUTTONS ===== */
        #choice-box {
            display: none; position: fixed;
            bottom: 40px; left: 50%; transform: translateX(-50%);
            width: min(90%, 500px);
            background: rgba(40, 25, 10, 0.94);
            border: 2px solid rgba(200, 170, 100, 0.4);
            border-radius: 14px; padding: 18px 22px;
            z-index: 31;
            box-shadow: 0 0 30px rgba(200, 150, 50, 0.2);
        }
        #choice-prompt {
            color: #e8d0a0; font-size: 1.1rem; line-height: 1.5;
            margin-bottom: 14px;
            text-shadow: 0 0 6px rgba(200, 170, 100, 0.3);
        }
        .choice-buttons {
            display: flex; flex-direction: column; gap: 10px;
        }
        .choice-btn {
            font-family: 'Architects Daughter', cursive;
            font-size: 1.05rem;
            color: #f0e8d8;
            background: linear-gradient(135deg, rgba(120, 90, 40, 0.5), rgba(80, 60, 30, 0.4));
            border: 2px solid rgba(200, 170, 100, 0.35);
            border-radius: 10px;
            padding: 12px 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .choice-btn:hover {
            background: linear-gradient(135deg, rgba(160, 120, 50, 0.6), rgba(120, 90, 40, 0.5));
            border-color: rgba(220, 190, 120, 0.6);
            box-shadow: 0 0 15px rgba(200, 160, 60, 0.3);
            transform: translateX(4px);
        }
        .choice-btn:active {
            transform: translateX(2px) scale(0.98);
        }

        /* ===== QUEST HUD (top right) ===== */
        #quest-hud {
            position: fixed; top: 10px; right: 10px;
            color: #b0d4ff; font-size: 0.95rem; z-index: 20;
            text-shadow: 0 0 8px rgba(60, 140, 255, 0.5);
            text-align: right;
            max-width: 260px;
            padding: 6px 12px;
            background: rgba(15, 12, 40, 0.5);
            border: 1px solid rgba(150, 180, 255, 0.2);
            border-radius: 8px;
            opacity: 0.85;
            transition: all 0.4s ease;
        }
        #quest-hud.library-quest-hud {
            color: #e8d0a0;
            text-shadow: 0 0 8px rgba(200, 160, 80, 0.5);
            background: rgba(40, 25, 10, 0.5);
            border-color: rgba(200, 170, 100, 0.2);
        }
        #quest-hud.sovereignty-quest-hud {
            color: #c0d0e8;
            text-shadow: 0 0 8px rgba(120, 150, 200, 0.5);
            background: rgba(10, 15, 30, 0.5);
            border-color: rgba(120, 150, 200, 0.2);
        }
        #quest-hud.temple-quest-hud {
            color: #e8d0a0;
            text-shadow: 0 0 8px rgba(200, 160, 80, 0.5);
            background: rgba(40, 25, 10, 0.5);
            border-color: rgba(200, 170, 100, 0.2);
        }
        #quest-hud-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
            margin-bottom: 2px;
        }

        /* ===== SOVEREIGNTY INTERROGATION ROOM (small, windowless, oppressive) ===== */
        #sovereignty { width: 600px; background: linear-gradient(180deg, #0a0a14 0%, #15152a 40%, #1e1e2a 40%, #141420 100%); display: none; }
        #sovereignty .floor {
            position: absolute; bottom: 0; width: 100%; height: 60%;
            background:
                repeating-linear-gradient(90deg, rgba(80, 80, 100, 0.12) 0px, rgba(80, 80, 100, 0.12) 1px, transparent 1px, transparent 60px),
                repeating-linear-gradient(0deg, rgba(80, 80, 100, 0.12) 0px, rgba(80, 80, 100, 0.12) 1px, transparent 1px, transparent 60px),
                linear-gradient(180deg, #1e1e2a 0%, #141420 100%);
        }
        #sovereignty .wall {
            position: absolute; top: 0; width: 100%; height: 40%;
            background:
                repeating-linear-gradient(90deg, rgba(50, 50, 70, 0.4) 0px, rgba(50, 50, 70, 0.4) 2px, transparent 2px, transparent 40px),
                repeating-linear-gradient(0deg, rgba(50, 50, 70, 0.35) 0px, rgba(50, 50, 70, 0.35) 2px, transparent 2px, transparent 20px),
                linear-gradient(180deg, #0a0a14 0%, #15152a 100%);
        }
        /* Bare stone walls on the sides */
        .sov-wall-edge {
            position: absolute; bottom: 0;
            width: 20px; height: 100%;
            background: linear-gradient(90deg, #2a2a3a, #1a1a2a);
            z-index: 5;
        }
        .sov-wall-edge.left { left: 0; border-right: 2px solid #3a3a4a; }
        .sov-wall-edge.right { right: 0; border-left: 2px solid #3a3a4a; }
        /* Single dim lantern on the wall */
        .sov-lantern {
            position: absolute; top: 15%;
            width: 12px; height: 20px;
            z-index: 6;
        }
        .sov-lantern::before {
            content: ''; position: absolute;
            bottom: 0; left: 3px;
            width: 6px; height: 14px;
            background: linear-gradient(180deg, #4a4a60, #3a3a50);
            border-radius: 2px;
        }
        .sov-lantern::after {
            content: ''; position: absolute;
            top: -6px; left: 0;
            width: 12px; height: 10px;
            background: radial-gradient(ellipse, rgba(180, 160, 120, 0.6) 0%, rgba(150, 130, 90, 0.3) 50%, transparent 70%);
            border-radius: 50%;
            animation: candle-flicker 1s ease-in-out infinite alternate;
        }
        .sov-lantern-glow {
            position: absolute;
            width: 120px; height: 120px;
            background: radial-gradient(ellipse, rgba(180, 160, 120, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* ===== EHRENFEST TEMPLE (white walls, blue tapestries, divine spring) ===== */
        #temple { width: 1800px; background: linear-gradient(180deg, #d0d4da 0%, #e0e4ea 40%, #c8ccd4 40%, #b8bcc4 100%); display: none; }
        #temple .floor {
            position: absolute; bottom: 0; width: 100%; height: 60%;
            background:
                repeating-linear-gradient(90deg, rgba(160, 170, 185, 0.2) 0px, rgba(160, 170, 185, 0.2) 1px, transparent 1px, transparent 90px),
                repeating-linear-gradient(0deg, rgba(160, 170, 185, 0.2) 0px, rgba(160, 170, 185, 0.2) 1px, transparent 1px, transparent 90px),
                linear-gradient(180deg, #c8ccd4 0%, #b8bcc4 100%);
        }
        #temple .wall {
            position: absolute; top: 0; width: 100%; height: 40%;
            background:
                repeating-linear-gradient(90deg, rgba(180, 185, 195, 0.25) 0px, rgba(180, 185, 195, 0.25) 2px, transparent 2px, transparent 70px),
                repeating-linear-gradient(0deg, rgba(180, 185, 195, 0.2) 0px, rgba(180, 185, 195, 0.2) 2px, transparent 2px, transparent 35px),
                linear-gradient(180deg, #d0d4da 0%, #e0e4ea 100%);
        }
        /* Blue tapestries — divine color of spring */
        .temple-tapestry {
            position: absolute; top: 5%;
            width: 44px; height: 100px;
            background: linear-gradient(180deg, #1a40a0 0%, #2050c0 30%, #1a40a0 60%, #1838a0 100%);
            border: 2px solid #3060d0;
            border-radius: 0 0 22px 22px;
            z-index: 4;
            box-shadow: 0 0 12px rgba(40, 80, 200, 0.2);
        }
        .temple-tapestry::after {
            content: ''; position: absolute;
            top: 15px; left: 50%; transform: translateX(-50%);
            width: 18px; height: 18px;
            background: radial-gradient(circle, rgba(180, 210, 255, 0.6) 0%, rgba(100, 160, 255, 0.3) 60%, transparent 70%);
            border-radius: 50%;
        }
        .temple-tapestry::before {
            content: ''; position: absolute;
            top: 45px; left: 50%; transform: translateX(-50%);
            width: 24px; height: 2px;
            background: rgba(150, 190, 255, 0.4);
        }
        .temple-pillar {
            position: absolute; bottom: 0;
            width: 36px; height: 100%;
            background: linear-gradient(90deg, #c0c4cc 0%, #e0e4ec 30%, #d0d4dc 60%, #c0c4cc 100%);
            border-left: 2px solid #e0e4ec;
            border-right: 2px solid #a8acb4;
            z-index: 5;
        }
        .temple-pillar::before {
            content: ''; position: absolute;
            top: 0; left: -6px; width: 48px; height: 18px;
            background: linear-gradient(180deg, #e0e4ec, #d0d4dc);
            border-radius: 4px 4px 0 0;
        }
        .temple-pillar::after {
            content: ''; position: absolute;
            bottom: 0; left: -4px; width: 44px; height: 14px;
            background: linear-gradient(180deg, #d0d4dc, #c0c4cc);
        }
        .stained-glass {
            position: absolute; top: 3%;
            width: 70px; height: 120px;
            border: 3px solid #a0a8b8;
            border-radius: 35px 35px 0 0;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(60, 140, 255, 0.2);
        }
        .stained-glass-inner {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg,
                rgba(60, 140, 255, 0.35) 0%,
                rgba(100, 180, 255, 0.25) 25%,
                rgba(40, 100, 220, 0.3) 50%,
                rgba(80, 160, 255, 0.2) 75%,
                rgba(60, 140, 255, 0.35) 100%);
        }
        .stained-glass::after {
            content: ''; position: absolute;
            top: 50%; left: 0; right: 0; height: 2px;
            background: #a0a8b8; z-index: 1;
        }
        .stained-glass::before {
            content: ''; position: absolute;
            top: 0; bottom: 0; left: 50%; width: 2px;
            background: #a0a8b8; z-index: 1;
        }
        .temple-altar {
            position: absolute; bottom: 60%;
            width: 100px; height: 50px;
            background: linear-gradient(180deg, #7a5a38 0%, #5a3d20 100%);
            border: 2px solid #8a6a48;
            border-radius: 4px;
        }
        .temple-altar::before {
            content: ''; position: absolute;
            top: 4px; left: 50%; transform: translateX(-50%);
            width: 30px; height: 30px;
            background: radial-gradient(circle, rgba(100, 180, 255, 0.7) 0%, rgba(60, 140, 255, 0.3) 60%, transparent 70%);
            border-radius: 50%;
            animation: altar-glow 3s ease-in-out infinite;
        }
        @keyframes altar-glow {
            0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(0.9); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.1); }
        }
        .temple-candle {
            position: absolute; bottom: 62%;
            width: 16px; height: 35px;
        }
        .temple-candle::before {
            content: ''; position: absolute;
            bottom: 0; left: 4px;
            width: 8px; height: 25px;
            background: linear-gradient(180deg, #e8d8b0, #c8b890);
            border-radius: 2px;
        }
        .temple-candle::after {
            content: ''; position: absolute;
            top: -6px; left: 2px;
            width: 12px; height: 12px;
            background: radial-gradient(ellipse, #ffcc44 0%, #ff9922 40%, transparent 70%);
            border-radius: 50%;
            animation: candle-flicker 0.8s ease-in-out infinite alternate;
        }

        /* Sovereignty-themed dialogue */
        #dialogue-box.sovereignty-theme {
            background: rgba(10, 15, 30, 0.94);
            border-color: rgba(120, 150, 200, 0.4);
            box-shadow: 0 0 30px rgba(80, 110, 200, 0.2);
        }
        .sovereignty-theme #dialogue-name { color: #c0d0e8; text-shadow: 0 0 6px rgba(120, 150, 200, 0.5); }
        .sovereignty-theme #dialogue-text { color: #d8e0f0; }
        .sovereignty-theme #dialogue-next { color: rgba(150, 180, 220, 0.6); }

        /* Temple-themed dialogue */
        #dialogue-box.temple-theme {
            background: rgba(40, 25, 10, 0.94);
            border-color: rgba(200, 170, 100, 0.4);
            box-shadow: 0 0 30px rgba(200, 150, 50, 0.2);
        }

    <script>
        // ===== ELEMENTS =====
        const titleScreen = document.getElementById('title-screen');
        const gameScreen = document.getElementById('game-screen');

        const camera = document.getElementById('camera');

        const myneShadow = document.getElementById('myne-shadow');
        const hannelore = document.getElementById('hannelore');
        const hanneloreShadow = document.getElementById('hannelore-shadow');
        const dialogueBox = document.getElementById('dialogue-box');
        const dialogueName = document.getElementById('dialogue-name');
